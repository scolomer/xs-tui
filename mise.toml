[tools]
rust = "latest"
bun = "latest"

[tasks.build]
description = "Compile agz (release) et vérifie l'extension agentz"
run = [
  "cargo build --release",
  "bun install --cwd extension",
  "bun run --cwd extension typecheck",
]

[tasks.start]
description = "Compile puis lance agz"
depends = ["build"]
run = "./target/release/agz"

[tasks.install]
description = "Installe agz dans ~/.cargo/bin et l'extension agentz dans omp"
depends = ["extension:install"]
run = "cargo install --path . --locked"

[tasks."extension:install"]
description = "Installe l'extension agentz dans omp (lien ~/.omp/agent/extensions/agentz)"
run = [
  "bun install --cwd extension",
  "mkdir -p ~/.omp/agent/extensions",
  "ln -sfn {{config_root}}/extension ~/.omp/agent/extensions/agentz",
]

[tasks."extension:check"]
description = "Vérifie que omp charge l'extension agentz installée et qu'elle publie"
run = "bun extension/scripts/check.ts"

[tasks.test]
description = "Tests Rust et extension"
run = ["cargo test", "bun test --cwd extension"]
