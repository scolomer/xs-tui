[tools]
rust = "latest"
bun = "latest"

[tasks.build]
description = "Compile agz (release) et vérifie l'extension agentz"
run = [
  "cargo build --release",
  "bun install --cwd extension",
  "bun run --cwd extension typecheck",
]

[tasks.start]
description = "Compile puis lance agz"
depends = ["build"]
run = "./target/release/agz"

[tasks.test]
description = "Tests Rust et extension"
run = ["cargo test", "bun test --cwd extension"]
